---
# Split login/game mode (scaling Phase 1): run the login protocol and the game
# world as separate roles of the same server image. `CANARY_ROLE` selects the
# listeners (login: login + status; game: game world only) and the session
# handoff stays DB-mediated, so the roles only need to share one database.
#
# Run from the repository root, naming the role services explicitly:
#
#   docker compose -f docker-compose.yml -f docker/docker-compose.split.yml up -d --build login game
#
# Compose overrides cannot delete the base `server` service, so a bare `up`
# (no service names) would also start it and collide on the host ports. Use
# either the base `server` or the `login` + `game` pair, never both.
#
# Login instances scale by replica count behind a TCP (L4) load balancer. The
# published host port below covers the single-login-instance case; drop it when
# running more than one replica (Docker cannot bind one host port for several
# containers) and let the L4 load balancer reach the replicas at `login:7171`
# (and `game:7172`) over the `canary-net` network. See docker/DOCKER.md,
# "Split login/game mode". No `container_name` is set here, so `--scale
# login=N` works.
#
# MariaDB single-DB mode combines with docker/docker-compose.mariadb.yml (which
# repoints both roles at the `mariadb` service):
#
#   docker compose -f docker-compose.yml -f docker/docker-compose.split.yml -f docker/docker-compose.mariadb.yml up -d --build login game
services:
  # Login role: database + account/login repositories, then the login/status
  # listener only. No map, Lua, items, dispatcher or save manager.
  login:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CANARY_ROLE: "login"
      CANARY_DB_ENGINE: "${CANARY_DB_ENGINE:-mariadb}"
      CANARY_DB_HOST: "mariadb"
      CANARY_DB_PORT: "3306"
      CANARY_DB_NAME: "${CANARY_DB_NAME:-canary}"
      CANARY_DB_USER: "${CANARY_DB_USER:-canary}"
      CANARY_DB_PASSWORD: "${CANARY_DB_PASSWORD:-canary}"
      CANARY_SERVER_NAME: "${CANARY_SERVER_NAME:-Canary Kotlin Server}"
      CANARY_IP: "${CANARY_IP:-127.0.0.1}"
      CANARY_LOGIN_PORT: "${CANARY_LOGIN_PORT:-7171}"
      CANARY_STATUS_PORT: "${CANARY_STATUS_PORT:-7171}"
      CANARY_GAME_PORT: "${CANARY_GAME_PORT:-7172}"
      # Optional RSA handshake override; omit to use the built-in OpenTibia pair.
      CANARY_RSA_P: "${CANARY_RSA_P:-}"
      CANARY_RSA_Q: "${CANARY_RSA_Q:-}"
      # The Prometheus exporter stays on the game role; login replicas cannot
      # share one fixed host metrics port.
    ports:
      - "${CANARY_LOGIN_PORT:-7171}:${CANARY_LOGIN_PORT:-7171}"
    volumes:
      # Same read-only game-data mounts as the base server, so both roles share
      # the identical image/volume contract (the login role never loads them).
      - ../data:/app/data:ro
      - ../data-canary:/app/data-canary:ro
      - ../data-otservbr-global:/app/data-otservbr-global:ro
    networks:
      - canary-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $$CANARY_LOGIN_PORT || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mariadb:
        condition: service_healthy

  # Game role: the full world boot (map, Lua, dispatcher, save manager) with
  # the game listener only; no login listener.
  game:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CANARY_ROLE: "game"
      CANARY_DB_ENGINE: "${CANARY_DB_ENGINE:-mariadb}"
      CANARY_DB_HOST: "mariadb"
      CANARY_DB_PORT: "3306"
      CANARY_DB_NAME: "${CANARY_DB_NAME:-canary}"
      CANARY_DB_USER: "${CANARY_DB_USER:-canary}"
      CANARY_DB_PASSWORD: "${CANARY_DB_PASSWORD:-canary}"
      CANARY_SERVER_NAME: "${CANARY_SERVER_NAME:-Canary Kotlin Server}"
      CANARY_IP: "${CANARY_IP:-127.0.0.1}"
      CANARY_GAME_PORT: "${CANARY_GAME_PORT:-7172}"
      # Optional RSA handshake override; omit to use the built-in OpenTibia pair.
      CANARY_RSA_P: "${CANARY_RSA_P:-}"
      CANARY_RSA_Q: "${CANARY_RSA_Q:-}"
      # Optional Prometheus exporter (see metrics/README.md).
      CANARY_METRICS_ENABLE_PROMETHEUS: "${CANARY_METRICS_ENABLE_PROMETHEUS:-false}"
      CANARY_METRICS_PROMETHEUS_ADDRESS: "${CANARY_METRICS_PROMETHEUS_ADDRESS:-0.0.0.0:9464}"
    ports:
      - "${CANARY_GAME_PORT:-7172}:${CANARY_GAME_PORT:-7172}"
      # Prometheus exporter (serves only when CANARY_METRICS_ENABLE_PROMETHEUS=true).
      - "${CANARY_METRICS_PORT:-9464}:9464"
    volumes:
      - ../data:/app/data:ro
      - ../data-canary:/app/data-canary:ro
      - ../data-otservbr-global:/app/data-otservbr-global:ro
    networks:
      - canary-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $$CANARY_GAME_PORT || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      mariadb:
        condition: service_healthy
