---
# Canonical Canary Kotlin Docker stack (adapted from canary/docker/docker-compose.yml).
#
# The repository-root `docker-compose.yml` includes this file, so run Compose from
# the repository root (or use docker/up.sh / docker/up.ps1):
#
#   cp docker/.env.dist .env        # optional; defaults work out of the box
#   docker compose up -d --build
#
# Relative paths resolve against this file, so the build context and the game
# data folders point at the repository root regardless of where Compose runs.
name: canary-kotlin

services:
  db:
    image: postgres:16-alpine
    container_name: canary-kotlin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${CANARY_DB_NAME:-canary}"
      POSTGRES_USER: "${CANARY_DB_USER:-canary}"
      POSTGRES_PASSWORD: "${CANARY_DB_PASSWORD:-canary}"
    networks:
      - canary-net
    ports:
      - "${CANARY_DB_PORT:-5432}:5432"
    volumes:
      - db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CANARY_DB_USER:-canary} -d ${CANARY_DB_NAME:-canary}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MariaDB for the upstream MyAAC website and opentibiabr/login-server
  # components below (both are MySQL-only). The Kotlin game server keeps using
  # the PostgreSQL `db` service; see docker/DOCKER.md.
  mariadb:
    image: mariadb:11.4
    container_name: canary-kotlin-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${CANARY_DB_NAME:-canary}"
      MARIADB_USER: "${CANARY_DB_USER:-canary}"
      MARIADB_PASSWORD: "${CANARY_DB_PASSWORD:-canary}"
      MARIADB_ROOT_PASSWORD: "${CANARY_DB_ROOT_PASSWORD:-root}"
    networks:
      - canary-net
    volumes:
      - mariadb-volume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: canary-kotlin-server
    restart: unless-stopped
    environment:
      # Server role (all|login|game): all runs both listeners in one process;
      # docker/docker-compose.split.yml runs login and game as separate services.
      CANARY_ROLE: "${CANARY_ROLE:-all}"
      # Engine selector: postgres (default) or maria/mariadb/mysql. MariaDB
      # also needs docker/docker-compose.mariadb.yml (which repoints host/port);
      # setting only this variable on the base stack keeps CANARY_DB_HOST=db.
      CANARY_DB_ENGINE: "${CANARY_DB_ENGINE:-postgres}"
      CANARY_DB_HOST: "db"
      CANARY_DB_PORT: "5432"
      CANARY_DB_NAME: "${CANARY_DB_NAME:-canary}"
      CANARY_DB_USER: "${CANARY_DB_USER:-canary}"
      CANARY_DB_PASSWORD: "${CANARY_DB_PASSWORD:-canary}"
      CANARY_SERVER_NAME: "${CANARY_SERVER_NAME:-Canary Kotlin Server}"
      CANARY_IP: "${CANARY_IP:-127.0.0.1}"
      CANARY_LOGIN_PORT: "${CANARY_LOGIN_PORT:-7171}"
      CANARY_GAME_PORT: "${CANARY_GAME_PORT:-7172}"
      CANARY_STATUS_PORT: "${CANARY_STATUS_PORT:-7171}"
      # Application log level (Canary `logLevel`): info (default) | debug | trace...
      CANARY_LOG_LEVEL: "${CANARY_LOG_LEVEL:-info}"
      # The full otservbr datapack by default; its world map is fetched on boot
      # (see docker/DOCKER.md) into the writable datapack mount below.
      CANARY_DATA_DIR: "${CANARY_DATA_DIR:-data-otservbr-global}"
      CANARY_MAP_NAME: "${CANARY_MAP_NAME:-otservbr}"
      CANARY_TOGGLE_DOWNLOAD_MAP: "${CANARY_TOGGLE_DOWNLOAD_MAP:-true}"
      CANARY_MAP_DOWNLOAD_URL: "${CANARY_MAP_DOWNLOAD_URL:-https://github.com/opentibiabr/canary/releases/download/v3.6.1/otservbr.otbm}"
      # Canary `config.lua.dist` value the datapack `raids.lua` parses as HH:MM:SS.
      CANARY_GLOBAL_SERVER_SAVE_TIME: "${CANARY_GLOBAL_SERVER_SAVE_TIME:-06:00:00}"
      CANARY_SAVE_INTERVAL_TYPE: "${CANARY_SAVE_INTERVAL_TYPE:-hour}"
      CANARY_SAVE_INTERVAL_TIME: "${CANARY_SAVE_INTERVAL_TIME:-10}"
      # The OTBM world needs a larger heap than the JVM container default.
      JAVA_OPTS: "${CANARY_JAVA_OPTS:--Xmx12g}"
      # Optional RSA handshake override; omit to use the built-in OpenTibia pair.
      CANARY_RSA_P: "${CANARY_RSA_P:-}"
      CANARY_RSA_Q: "${CANARY_RSA_Q:-}"
      # Optional Prometheus exporter (see metrics/README.md).
      CANARY_METRICS_ENABLE_PROMETHEUS: "${CANARY_METRICS_ENABLE_PROMETHEUS:-false}"
      CANARY_METRICS_PROMETHEUS_ADDRESS: "${CANARY_METRICS_PROMETHEUS_ADDRESS:-0.0.0.0:9464}"
    ports:
      - "${CANARY_LOGIN_PORT:-7171}:7171"
      - "${CANARY_GAME_PORT:-7172}:7172"
      # Prometheus exporter (serves only when CANARY_METRICS_ENABLE_PROMETHEUS=true).
      - "${CANARY_METRICS_PORT:-9464}:9464"
    volumes:
      # Core data read-only; the selected datapack is writable because the
      # world map is downloaded on boot; see docker/DOCKER.md.
      - ../data:/app/data:ro
      - ../data-canary:/app/data-canary:ro
      - ../data-otservbr-global:/app/data-otservbr-global
    networks:
      - canary-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7171 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy

  # Upstream MyAAC website/admin (canary/docker/docker-compose.yml). MySQL-only:
  # it reads the `mariadb` service, not the Kotlin game database.
  myaac:
    build:
      context: .
      dockerfile: quickstart/myaac/Dockerfile
      args:
        MYAAC_REF: "${MYAAC_REF:-2.x}"
    container_name: canary-kotlin-myaac
    restart: unless-stopped
    environment:
      CANARY_DB_HOST: "mariadb"
      CANARY_DB_PORT: "3306"
      CANARY_DB_NAME: "${CANARY_DB_NAME:-canary}"
      CANARY_DB_USER: "${CANARY_DB_USER:-canary}"
      CANARY_DB_PASSWORD: "${CANARY_DB_PASSWORD:-canary}"
      CANARY_SERVER_NAME: "${CANARY_SERVER_NAME:-Canary Kotlin Server}"
      CANARY_SERVER_IP: "${CANARY_IP:-127.0.0.1}"
      CANARY_SERVER_LOCATION: "${CANARY_SERVER_LOCATION:-BRA}"
      CANARY_LOGIN_PORT: "${CANARY_LOGIN_PORT:-7171}"
      CANARY_GAME_PORT: "${CANARY_GAME_PORT:-7172}"
      CANARY_STATUS_PORT: "${CANARY_STATUS_PORT:-7171}"
      CANARY_STATUS_TIMEOUT: "${CANARY_STATUS_TIMEOUT:-5000}"
      CANARY_DATA_PACK: "${CANARY_DATA_PACK:-data-otservbr-global}"
      MYAAC_SITE_URL: "${MYAAC_SITE_URL:-http://localhost:8080}"
      MYAAC_ADMIN_ACCOUNT: "${MYAAC_ADMIN_ACCOUNT:-myaacadmin}"
      MYAAC_ADMIN_EMAIL: "${MYAAC_ADMIN_EMAIL:-admin@localhost.local}"
      MYAAC_ADMIN_PASSWORD: "${MYAAC_ADMIN_PASSWORD:-admin123}"
      MYAAC_ADMIN_PLAYER: "${MYAAC_ADMIN_PLAYER:-ADM1}"
      MYAAC_CLIENT_VERSION: "${MYAAC_CLIENT_VERSION:-1513}"
      MYAAC_TIMEZONE: "${MYAAC_TIMEZONE:-America/Fortaleza}"
    ports:
      - "${MYAAC_HTTP_PORT:-8080}:80"
    networks:
      - canary-net
    depends_on:
      mariadb:
        condition: service_healthy
      server:
        condition: service_started

  # Upstream client login webservice (opentibiabr/login-server). MySQL-only:
  # it reads the `mariadb` service. The Kotlin server's native login stays on
  # CANARY_LOGIN_PORT (7171); this webservice serves modern clients at 8088.
  login-server:
    image: "${LOGIN_SERVER_IMAGE:-opentibiabr/login-server:latest}"
    container_name: canary-kotlin-login-server
    restart: unless-stopped
    environment:
      LOGIN_HTTP_PORT: "${LOGIN_HTTP_PORT:-8088}"
      LOGIN_GRPC_PORT: "${LOGIN_GRPC_PORT:-9090}"
      MYSQL_HOST: "mariadb"
      MYSQL_PORT: "3306"
      MYSQL_DBNAME: "${CANARY_DB_NAME:-canary}"
      MYSQL_USER: "${CANARY_DB_USER:-canary}"
      MYSQL_PASS: "${CANARY_DB_PASSWORD:-canary}"
      SERVER_NAME: "${CANARY_SERVER_NAME:-Canary Kotlin Server}"
      SERVER_IP: "${CANARY_IP:-127.0.0.1}"
      SERVER_PORT: "${CANARY_GAME_PORT:-7172}"
      SERVER_LOCATION: "${CANARY_SERVER_LOCATION:-BRA}"
      RATE_LIMITER_RATE: "${LOGIN_RATE_LIMITER_RATE:-2}"
      RATE_LIMITER_BURST: "${LOGIN_RATE_LIMITER_BURST:-5}"
    ports:
      - "${LOGIN_HTTP_PORT:-8088}:${LOGIN_HTTP_PORT:-8088}"
      - "${LOGIN_GRPC_PORT:-9090}:${LOGIN_GRPC_PORT:-9090}"
    networks:
      - canary-net
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  db-volume:
  mariadb-volume:

networks:
  canary-net:
    driver: bridge
