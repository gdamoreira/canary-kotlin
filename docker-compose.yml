version: '3.8'

services:
  db:
    image: mariadb:11.4
    container_name: canary-kotlin-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${CANARY_DB_NAME:-canary}"
      MARIADB_USER: "${CANARY_DB_USER:-canary}"
      MARIADB_PASSWORD: "${CANARY_DB_PASSWORD:-canary}"
      MARIADB_ROOT_PASSWORD: "${CANARY_DB_ROOT_PASSWORD:-root}"
    networks:
      - canary-net
    ports:
      - "${CANARY_DB_PORT:-3306}:3306"
    volumes:
      - canary-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: canary-kotlin-server
    restart: unless-stopped
    environment:
      CANARY_DB_HOST: "db"
      CANARY_DB_PORT: "3306"
      CANARY_DB_NAME: "${CANARY_DB_NAME:-canary}"
      CANARY_DB_USER: "${CANARY_DB_USER:-canary}"
      CANARY_DB_PASSWORD: "${CANARY_DB_PASSWORD:-canary}"
      CANARY_SERVER_NAME: "${CANARY_SERVER_NAME:-Canary Kotlin Server}"
      CANARY_IP: "${CANARY_IP:-127.0.0.1}"
      CANARY_LOGIN_PORT: "${CANARY_LOGIN_PORT:-7171}"
      CANARY_GAME_PORT: "${CANARY_GAME_PORT:-7172}"
      CANARY_STATUS_PORT: "${CANARY_STATUS_PORT:-7171}"
    ports:
      - "${CANARY_LOGIN_PORT:-7171}:7171"
      - "${CANARY_GAME_PORT:-7172}:7172"
    networks:
      - canary-net
    depends_on:
      db:
        condition: service_healthy

volumes:
  canary-db-data:

networks:
  canary-net:
    driver: bridge
