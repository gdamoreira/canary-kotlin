---
# Canary Kotlin metrics stack (adapted from canary/metrics/docker-compose.yml).
#
# Prometheus scrapes the server's metrics endpoint and Grafana is bundled as a
# dashboard front-end. Start it with `docker compose up -d` from this folder
# after enabling the exporter in config.lua:
#
#   metricsEnablePrometheus = true
#   metricsPrometheusAddress = "0.0.0.0:9464"
#
name: canary-kotlin-metrics

services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--log.level=debug"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    ports:
      - "4444:3000"
    networks:
      - monitoring-net

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring-net:
