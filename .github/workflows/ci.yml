name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (JDK 25)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew clean test installDist --console=plain

      - name: Report failing tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re
          for f in sorted(glob.glob('build/test-results/test/*.xml')):
              src = open(f, encoding='utf-8', errors='ignore').read()
              for m in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<(failure|error)[^>]*message="([^"]{0,300})', src):
                  msg = m.group(4).replace('%', '%25').replace('\r', ' ').replace('\n', ' ')[:280]
                  print(f"::error file={f}::{m.group(2)} :: {m.group(1)} :: {msg}")
          PY

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            build/test-results/test
            build/reports/tests/test
          if-no-files-found: ignore
