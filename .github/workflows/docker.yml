name: Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'docker/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'docker/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/docker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t canary-kotlin:ci .

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker/docker-compose.yml config
          docker compose -f docker-compose.yml -f docker/docker-compose.mariadb.yml config
          docker compose -f docker-compose.yml -f docker/docker-compose.split.yml config
          docker compose --profile split -f docker-compose.yml -f docker/docker-compose.split.yml -f docker/docker-compose.mariadb.yml config
