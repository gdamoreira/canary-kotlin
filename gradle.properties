# Canary Kotlin Edition — Gradle configuration.
#
# Heap sizing: the Kotlin compiler needs more than the default daemon heap to
# build this codebase (CI previously failed with OutOfMemoryError during
# :compileKotlin), and the full test suite needs a 3 GB test worker (see
# build.gradle.kts). Keep these values in sync with docs/building.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
